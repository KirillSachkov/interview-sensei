<!doctype html>
<!-- PROTOTYPE, throwaway. Ticket #3, iteration 2.
     Question: how does "one canvas = one Target" look, and where does the agent dialogue live?
     Three variants via ?variant=A|B|C, style via ?style=hand|clean.
     A: zones on canvas, floating chat. B: everything is a graph node, chat inside nodes. C: chat column + canvas of sessions.
     Libraries: rough.js (MIT) from unpkg, font Caveat (OFL) from Google Fonts. No build, in-memory state. -->
<html lang="ru"><head><meta charset="utf-8"><title>Прототип UI v2 — холст цели</title>

<style>
:root{--bg:#fdfcf9;--ink:#1e1e1e;--mute:#8a8780;--line:#e4e1da;--acc:#6965db;--accs:#ecebff;--ok:#2f9e44;--oks:#e6f6ea;--warn:#e8590c;--warns:#fff0e6;--none:#adb5bd;--card:#fff}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--ink)}
.st-clean{background-color:#fafafa;background-image:radial-gradient(#ddd 1px,transparent 1px);background-size:22px 22px}

.st-clean .ttl{font-size:16px;font-weight:650}
.st-hand .hand{font-family:Caveat,cursive;font-size:20px;line-height:1.1}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{background:#f4f3f0}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:#5753c9}
button.ghost{border-color:transparent;background:transparent;color:var(--mute)}button.ghost:hover{color:var(--ink);background:#f1f0ec}
button.sm{font-size:12px;padding:3px 8px}
textarea,input[type=text]{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;background:#fff}
textarea:focus,input:focus{outline:2px solid var(--accs);border-color:var(--acc)}
.mute{color:var(--mute)}.small{font-size:12px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#f1f0ec;color:#555;white-space:nowrap}
.tag.acc{background:var(--accs);color:var(--acc)}.tag.warn{background:var(--warns);color:var(--warn)}.tag.ok{background:var(--oks);color:var(--ok)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.d-confident{background:var(--ok)}.d-shaky{background:#f59f00}.d-none{background:transparent;border:1.5px solid var(--none)}
#vp{position:fixed;inset:0;overflow:hidden;cursor:grab}#vp.drag{cursor:grabbing}
.vC #vp{left:400px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#sv{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.node{position:absolute;padding:12px 14px;cursor:default}
.node.sh-frame{padding:16px}.node.sh-none{padding:0}
.node.sh-diamond{display:flex;align-items:center;justify-content:center;text-align:center;padding:0;cursor:pointer}
.node.sh-pill{cursor:pointer}
.frame-label{position:absolute;font-size:13px;color:var(--mute);transform:translateY(-100%);padding-bottom:4px}

.edge-label{font:12px -apple-system,sans-serif;fill:#8a8780}.st-hand .edge-label{font:17px Caveat,cursive}
.island{position:fixed;background:#fff;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.05);z-index:10}
/* card internals */
.qh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:12px;color:var(--mute)}
.qt{margin-bottom:8px}.st-clean .qt{font-weight:600}
.code{font:12px/1.5 ui-monospace,Menlo,monospace;background:#f6f5f2;border-radius:6px;padding:8px;white-space:pre;margin:6px 0}
.opt{border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin:4px 0;font-size:13px}.opt.on{border-color:var(--acc);background:var(--accs)}
.ans{background:#f6f5f2;border-radius:8px;padding:7px 9px;font-size:13px;margin:4px 0}
.fu{border-left:2px solid var(--line);padding-left:8px;margin:8px 0 4px;font-size:13px}
.deb{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:13px}
.grade{font-weight:700;font-size:15px}.g3{color:var(--ok)}.g2{color:#d9480f}.g1,.g0{color:#c92a2a}
.deb ul{margin:4px 0 6px;padding-left:18px}
.acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center}
.rate button{padding:2px 6px}
.msg{margin:8px 0;font-size:13.5px;position:relative}.msg.c{margin-left:40px;background:var(--accs);border-radius:10px;padding:7px 10px}
.msg.a .side-btn{display:none;position:absolute;right:0;top:-4px}.msg.a:hover .side-btn{display:inline-block}
.msg.sys{font-size:12px;color:var(--mute);text-align:center}
.working{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mute)}
.working i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.scroll{overflow:auto}
/* chat panel */
.chat{display:flex;flex-direction:column}
.chat .tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.chat .tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--mute);white-space:nowrap}
.chat .tabs button.on{color:var(--ink);background:#f4f3f0;font-weight:600}
.chat .body{flex:1;padding:6px 14px}.chat .inp{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px}
.chat .inp input{flex:1}
.brief{font-size:12px;background:#f6f5f2;border-radius:8px;padding:8px;color:#555;margin:6px 0}
/* sheets */
#sheet{position:fixed;top:12px;right:12px;bottom:12px;width:470px;display:none;flex-direction:column;z-index:30}
#sheet.on{display:flex}#sheet .hd{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#sheet .bd{flex:1;overflow:auto;padding:12px 16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.15);display:none;align-items:center;justify-content:center;z-index:40}
#modal.on{display:flex}#modal .island{position:static;width:420px;padding:20px}
.bq{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f0eee9;font-size:13px}.bq .mute{font-size:12px}
.bulk{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 0;display:flex;gap:6px;align-items:center}
.drop{border:2px dashed #cfccc4;border-radius:12px;padding:16px;text-align:center;color:var(--mute);font-size:13px}
.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.src{display:flex;gap:6px;font-size:13px;padding:3px 0}.src .tag{min-width:62px;text-align:center}
.sec{padding:8px 0;border-top:1px solid #f0eee9}.sec:first-of-type{border-top:0}
.sec.off{opacity:.45}
.topic{font-size:13px;margin:2px 0}
.link{color:var(--acc);cursor:pointer;font-size:12.5px}.link:hover{text-decoration:underline}
/* chrome */
#switch{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1e1e1e;color:#fff;border-radius:22px;padding:5px 8px;display:flex;gap:6px;align-items:center;z-index:50;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#switch button{background:transparent;color:#fff;border:0;padding:4px 10px}#switch button:hover{background:#333}
#switch .lbl{min-width:200px;text-align:center}#switch .on{background:#444}
#zoom{left:12px;bottom:12px;display:flex;align-items:center;padding:3px}.vC #zoom{left:412px}
#zoom button{border:0}
#tl{left:12px;top:12px;display:flex;gap:4px;padding:4px;align-items:center}
#tc{left:50%;top:12px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;align-items:center}
#menu{left:12px;top:56px;padding:6px;display:none;width:240px}#menu.on{display:block}
#menu div{padding:7px 10px;border-radius:7px;cursor:pointer}#menu div:hover{background:#f4f3f0}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#1e1e1e;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;display:none}
/* variant A chat */
#chatA{right:12px;bottom:12px;width:380px;height:460px}
#chatA.min{height:auto;width:auto}
/* variant C column */
#colC{position:fixed;left:0;top:0;bottom:0;width:400px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
#colC .top{padding:12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
#colC .mt{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
#colC .mt button{border:0}#colC .mt button.on{background:#f1f0ec;font-weight:600}
#colC .pane{flex:1;overflow:auto;display:flex;flex-direction:column}
.pad{padding:12px 16px}
.dl{padding:10px;font-size:13px;line-height:1.2}
.st-hand .dl b{font-family:Caveat,cursive;font-size:21px;font-weight:700}
.nodechat{max-height:230px;border-top:1px solid #f0eee9;margin-top:8px}
</style></head>
<body>
<div id="vp"><div id="world"></div></div>
<div id="chrome"></div>
<div id="sheet" class="island"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="switch"></div>
<script>
// ---------- data ----------
const SECTIONS=[
 {id:'s1',kind:'разговор',title:'Опыт и резюме',topics:[['Проекты из резюме','shaky'],['Работа в команде','confident']],q:12,nw:0},
 {id:'s2',kind:'вопросы по темам',title:'Go и конкурентность',topics:[['Горутины и планировщик','shaky'],['Каналы и select','shaky'],['context','confident'],['GC и память','none']],q:46,nw:7},
 {id:'s3',kind:'вопросы по темам',title:'PostgreSQL',topics:[['Индексы','shaky'],['Транзакции и изоляция','none']],q:23,nw:3},
 {id:'s4',kind:'проектирование',title:'System design',topics:[['Кеширование','none'],['Очереди','none']],q:8,nw:0,off:true},
];
const SOURCES=[['вакансия','Авито · Go-разработчик'],['вакансия','Ozon · Backend Go'],['резюме','resume-2026.pdf'],['видео','Мок собес Go #12'],['ссылка','The Go Memory Model']];
const PREFS=['Меньше определений, больше прикладных вопросов','Без вопросов про Go до 1.18'];
const BANK=[
 ['Чем горутина отличается от потока ОС?','Горутины и планировщик','видео «Мок собес Go #12»',{nw:1}],
 ['Как устроен буферизированный канал внутри?','Каналы и select','вакансия Авито',{nw:1}],
 ['Когда select выбирает ветку default?','Каналы и select','The Go Memory Model',{}],
 ['Как отменить группу горутин через context?','context','видео «Мок собес Go #12»',{warn:1}],
 ['Что такое write barrier в сборщике мусора?','GC и память','придумал агент',{nw:1,unc:1}],
 ['Что выведет код с замыканием в цикле? (квиз)','Горутины и планировщик','видео «Мок собес Go #12»',{nw:1}],
 ['Чем sync.Mutex отличается от sync.RWMutex?','Горутины и планировщик','вакансия Ozon',{}],
 ['Как работает escape analysis?','GC и память','The Go Memory Model',{nw:1}],
];
const TARGETS=[['go','Go middle','Авито · Ozon'],['tl','Tech Lead','Яндекс'],];
function initState(){return{
 target:'go',sheet:null,sheetArg:null,chatOpen:true,chatTab:'main',working:false,exp:{q3:1},sel:new Set(),onlyNew:false,colTab:'chat',debrief:false,seq:4,
 chat:[{r:'a',t:'Сессия «Мок 3»: секция «Go и конкурентность», без лимита времени. Остановите, когда захотите.'},{r:'c',t:'Поехали. Без подсказок, пожалуйста.'},{r:'a',t:'Хорошо. Вопросы приходят карточками на холсте.'}],
 setup:[{r:'a',t:'Расскажите, к чему готовимся. Можно бросить сюда вакансию, резюме или ссылку на видео.'}],
 qs:[
  {id:'q0',kind:'quiz',sec:'Go и конкурентность',topic:'Горутины и планировщик',text:'Что выведет программа?',code:'for i := 0; i < 3; i++ {\n    go func() { fmt.Print(i) }()\n}\ntime.Sleep(time.Second)',opts:['0, 1 и 2 в любом порядке','333','Ничего'],pick:0,fu:[],status:'done',grade:3,gaps:[],outline:'С Go 1.22 у каждой итерации своя переменная i.'},
  {id:'q1',sec:'Go и конкурентность',topic:'Горутины и планировщик',text:'Чем горутина отличается от потока ОС?',answer:'Горутина — лёгкий поток рантайма Go: стек от 2 КБ и растёт, переключение без ядра. Потоков ОС мало, горутин может быть миллион.',fu:[],status:'done',grade:3,gaps:[],outline:'Стек, стоимость переключения, планирование в user space.'},
  {id:'q2',parent:'q1',deeper:1,sec:'Go и конкурентность',topic:'Горутины и планировщик',text:'Как планировщик Go распределяет горутины по потокам ОС?',answer:'Модель GMP: G — горутина, M — поток, P — контекст исполнения с локальной очередью. GOMAXPROCS задаёт число P.',fu:[{a:'А если локальная очередь P пуста?',c:'Берёт из глобальной очереди или крадёт половину у другого P.'}],status:'done',grade:2,gaps:['Не назван netpoller','Нет handoff P при блокирующем syscall'],outline:'GMP, work stealing, handoff, netpoller, вытеснение с Go 1.14.'},
  {id:'q3',parent:'q2',deeper:1,sec:'Go и конкурентность',topic:'Горутины и планировщик',text:'Что делает рантайм, когда горутина уходит в блокирующий syscall?',fu:[],status:'current'},
 ],
 threads:[{id:'t1',from:'q2',title:'GMP на пальцах',hint:false,msgs:[{r:'c',t:'Объясни GMP на пальцах, я путаю P и M.'},{r:'a',t:'M — поток ОС. P — «право» исполнять Go-код плюс очередь горутин. M работает, только держа P.'},{r:'c',t:'Зачем тогда P вообще?'},{r:'a',t:'Чтобы M, застрявший в syscall, отдал P со всей очередью другому M. Без P очередь застряла бы вместе с потоком.'}]}],
};}
let S=initState();
const P=new URLSearchParams(location.search);
S.variant=P.get('variant')||'A';S.style=P.get('style')||'hand';
const DEEPER=['Что такое handoff P и когда рантайм его делает?','Как netpoller избавляет сетевой ввод-вывод от блокировки потока?'];
const FRESH=[['Каналы и select','Чем буферизированный канал отличается от небуферизированного?'],['GC и память','Когда сборщик мусора Go останавливает мир?']];

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
const q=id=>S.qs.find(x=>x.id===id);
const curQ=()=>S.qs.find(x=>x.status==='current');
const working=()=>S.working?'<span class="working"><i></i>Агент работает…</span>':'';
const topicLine=t=>`<div class="topic"><span class="dot d-${t[1]}"></span>${esc(t[0])}</div>`;

// ---------- shared fragments ----------
function qCard(x){
 const head=`<div class="qh"><span>${esc(x.topic)}</span>${x.deeper?'<span class="tag acc">глубже</span>':''}${x.kind==='quiz'?'<span class="tag">квиз</span>':''}${x.hint?'<span class="tag warn">с подсказкой</span>':''}${x.skipped?'<span class="tag">пропущено</span>':''}</div>`;
 let h=head+`<div class="qt ${x.kind==='quiz'?'':'hand-q'}">${esc(x.text)}</div>`;
 if(x.kind==='quiz') h+=`<div class="code">${esc(x.code)}</div>`+x.opts.map((o,i)=>`<div class="opt ${i===x.pick?'on':''}">${esc(o)}</div>`).join('');
 if(x.answer!=null) h+=`<div class="ans">${esc(x.answer)}</div>`;
 x.fu.forEach(f=>{h+=`<div class="fu"><span class="mute small">Follow-up:</span> ${esc(f.a)}${f.c?`<div class="ans">${esc(f.c)}</div>`:''}</div>`});
 if(x.status==='current'){
  h+=`<textarea id="ans-${x.id}" rows="3" placeholder="${x.fu.length?'Уточните ответ…':'Ваш ответ…'}"></textarea>
  <div class="acts"><button class="pri" onclick="act('submit','${x.id}')">Ответить</button><button onclick="act('dunno','${x.id}')">Не знаю</button><span class="sp"></span><button class="ghost sm" onclick="act('side','${x.id}')">↗ Обсудить отдельно</button></div>`;
 } else {
  h+=`<div class="acts"><button class="sm" onclick="act('reveal','${x.id}')">${x.reveal?'Скрыть разбор':'Посмотреть разбор'}</button><button class="ghost sm" onclick="act('side','${x.id}')">↗ Обсудить отдельно</button><span class="sp"></span><span class="rate"><button class="ghost sm" title="полезный" onclick="toast('👍 Question rating сохранён')">👍</button><button class="ghost sm" title="ошибка" onclick="toast('⚠ Вопрос скрыт до исправления')">⚠</button><button class="ghost sm" title="нерелевантный" onclick="toast('👎 Вопрос исключён для этой цели')">👎</button></span></div>`;
  if(x.reveal) h+=`<div class="deb"><span class="grade g${x.grade}">${x.grade} / 3</span> ${x.disputed?'<span class="tag warn">оспорено, агент пересматривает</span>':''}
   ${x.gaps.length?'<div class="mute small" style="margin-top:4px">Пробелы</div><ul>'+x.gaps.map(g=>`<li>${esc(g)}</li>`).join('')+'</ul>':'<div class="small" style="margin:4px 0">Пробелов нет.</div>'}
   <div class="mute small">Сильный ответ</div><div>${esc(x.outline||'')}</div>
   ${x.disputed?'':`<div class="acts"><button class="ghost sm" onclick="act('dispute','${x.id}')">Оспорить оценку</button></div>`}</div>`;
 }
 return h;
}
function debriefCard(){
 return `<div class="ttl">Итог: Мок 3</div><div class="small mute" style="margin:4px 0 8px">${S.qs.filter(x=>x.status==='done').length} вопроса · 24 мин</div>
 <div class="small"><b>Topic status</b></div>
 <div class="topic"><span class="dot d-shaky"></span>Горутины и планировщик: не начата → шаткая</div>
 <div class="topic"><span class="dot d-confident"></span>context: без изменений</div>
 <div class="small" style="margin-top:8px"><b>Дальше</b>: каналы и select, затем GC.</div>
 <div class="acts"><button class="pri sm" onclick="openModal('start')">Следующий мок</button><button class="ghost sm" onclick="act('sideDebrief')">↗ Обсудить отдельно</button></div>`;
}
function msgs(list,withSide){return list.map((m,i)=>`<div class="msg ${m.r}">${m.r==='a'&&withSide?`<button class="ghost sm side-btn" onclick="act('sideMsg',${i})">↗</button>`:''}${m.brief?`<div class="brief"><b>Handoff brief</b><br>${esc(m.brief)}</div>`:''}${esc(m.t)}</div>`).join('')}
function chatTabs(){return `<div class="tabs"><button class="${S.chatTab==='main'?'on':''}" onclick="S.chatTab='main';render()">Мок 3</button>${S.threads.map(t=>`<button class="${S.chatTab===t.id?'on':''}" onclick="S.chatTab='${t.id}';render()">↗ ${esc(t.title)}</button>`).join('')}</div>`}
function chatBody(){
 if(S.target==='new') return msgs(S.setup);
 if(S.chatTab==='main') return msgs(S.chat,true);
 const t=S.threads.find(x=>x.id===S.chatTab);return `<div class="msg sys">Side thread от вопроса «${esc(q(t.from)?.text||'итог')}». Только чтение: оценок здесь нет.</div>`+msgs(t.msgs);
}
function chatInput(tab){return `<div class="inp"><input type="text" id="ci-${tab}" placeholder="${tab==='main'?'Сказать агенту вне вопроса…':'Спросить в ветке…'}" onkeydown="if(event.key==='Enter')act('send','${tab}')"><button onclick="act('send','${tab}')">↵</button></div>`}
function bankHTML(sec){

function fit(){const ns=S._spec.nodes;const x0=Math.min(...ns.map(n=>n.x)),y0=Math.min(...ns.map(n=>n.y)),x1=Math.max(...ns.map(n=>n.x+n.w)),y1=Math.max(...ns.map(n=>n.y+n.hh));
 const vp=$('#vp').getBoundingClientRect();cam.s=Math.max(.35,Math.min(1,(vp.width-80)/(x1-x0),(vp.height-140)/(y1-y0)));cam.x=(vp.width-(x1-x0)*cam.s)/2-x0*cam.s;cam.y=70-y0*cam.s;applyCam();}
function focusNode(id,s){const n=S._spec.nodes.find(n=>n.id===id);if(!n)return;const vp=$('#vp').getBoundingClientRect();cam.s=s||cam.s;cam.x=vp.width/2-(n.x+n.w/2)*cam.s;cam.y=vp.height/2-(n.y+Math.min(n.hh,500)/2)*cam.s;applyCam();}
function zoom(f,cx,cy){const vp=$('#vp').getBoundingClientRect();cx=cx??vp.width/2;cy=cy??vp.height/2;const ns=Math.max(.25,Math.min(2,cam.s*f));cam.x=cx-(cx-cam.x)*ns/cam.s;cam.y=cy-(cy-cam.y)*ns/cam.s;cam.s=ns;applyCam();}
(function(){const vp=$('#vp');let d=null;
 vp.addEventListener('wheel',e=>{const sc=e.target.closest('.scroll');if(sc&&sc.scrollHeight>sc.clientHeight&&!e.ctrlKey)return;e.preventDefault();
  if(e.ctrlKey||e.metaKey){const r=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top)}else{cam.x-=e.deltaX;cam.y-=e.deltaY;applyCam()}},{passive:false});
 vp.addEventListener('mousedown',e=>{if(e.target.closest('button,input,textarea,.link,.dl,.opt'))return;if(e.target.closest('.node')&&!e.altKey)return;d={x:e.clientX-cam.x,y:e.clientY-cam.y};vp.classList.add('drag')});
 addEventListener('mousemove',e=>{if(!d)return;cam.x=e.clientX-d.x;cam.y=e.clientY-d.y;applyCam()});
 addEventListener('mouseup',()=>{d=null;vp.classList.remove('drag')});
})();

// ---------- chrome per variant ----------
function targetMenu(){return `<div id="menu" class="island">${TARGETS.map(t=>`<div onclick="setTarget('${t[0]}')"><b>${t[1]}</b> <span class="mute small">${t[2]}</span></div>`).join('')}<div onclick="setTarget('new')" style="color:var(--acc)">＋ Новая цель</div></div>`}
function targetBtn(){const t=S.target==='new'?'Новая цель':'Go middle';return `<button onclick="$('#menu').classList.toggle('on')"><b>${t}</b> ▾</button>`}
function setTarget(t){if(t==='tl'){toast('В прототипе есть только «Go middle»');$('#menu').classList.remove('on');return}S.target=t;S.chatTab='main';render();fit();}
function renderChrome(spec){
 let h=`<div id="zoom" class="island"><button onclick="zoom(1/1.2)">−</button><span id="zv" class="small" style="width:44px;text-align:center">${Math.round(cam.s*100)}%</span><button onclick="zoom(1.2)">+</button><button class="sm" onclick="fit()" title="показать всё">⤢</button>${curQ()?`<button class="sm" onclick="focusNode('${curQ().id}',1)">к вопросу</button>`:''}</div>`;
 if(S.variant==='A'){
  h+=`<div id="tl" class="island">${targetBtn()}</div>${targetMenu()}
  <div id="tc" class="island"><button class="ghost" onclick="openModal('start')">▶ Мок</button><button class="ghost" onclick="openSheet('inbox')">Inbox <span class="tag acc">1</span></button><button class="ghost" onclick="openSheet('bank')">Банк вопросов</button>${S.working?'&nbsp;'+working()+'&nbsp;':''}</div>`;
  const tab=S.target==='new'?'setup':S.chatTab;
  h+=S.chatOpen?`<div id="chatA" class="island chat"><div class="row" style="padding:8px 10px 0"><b class="small">Агент</b><span class="sp"></span><button class="ghost sm" onclick="S.chatOpen=false;render()">свернуть</button></div>${S.target==='new'?'':chatTabs()}<div class="body scroll" id="cb">${chatBody()}${S.working?working():''}</div>${chatInput(tab)}</div>`
   :`<div id="chatA" class="island min"><button class="ghost" onclick="S.chatOpen=true;render()">💬 Агент ${S.working?working():''}</button></div>`;
 }
 if(S.variant==='B'){h+=`<div id="tl" class="island">${targetBtn()}${S.working?'&nbsp;'+working()+'&nbsp;':''}</div>${targetMenu()}`;}
 if(S.variant==='C'){
  const tabs=[['chat','Чат'],['plan','План'],['mat','Материалы'],['bank','Банк']];
  let pane='';const tab=S.target==='new'?'setup':S.chatTab;
  if(S.colTab==='chat'||S.target==='new')pane=`<div class="chat" style="flex:1;min-height:0">${S.target==='new'?'':chatTabs()}<div class="body scroll" id="cb">${chatBody()}${S.working?working():''}</div>${chatInput(tab)}</div>`;
  if(S.colTab==='plan')pane=`<div class="pad"><div class="row"><b>План собеседования</b><span class="sp"></span><button class="pri sm" onclick="openModal('start')">▶ Мок</button></div><div class="small mute">сложность: как есть</div>${planHTML(false)}</div>`;
  if(S.colTab==='mat')pane=`<div class="pad">${inboxHTML()}</div>`;
  if(S.colTab==='bank')pane=`<div class="pad">${bankHTML(S.sheetArg)}</div>`;
  h+=`<div id="colC"><div class="top">${targetBtn()}<span class="sp"></span>${S.working?working():''}</div>${targetMenu().replace('id="menu" class="island"','id="menu" class="island" style="left:12px;top:52px"')}
  ${S.target==='new'?'':`<div class="mt">${tabs.map(t=>`<button class="${S.colTab===t[0]?'on':''}" onclick="S.colTab='${t[0]}';render()">${t[1]}${t[0]==='mat'?' <span class="tag acc">1</span>':''}</button>`).join('')}</div>`}<div class="pane">${pane}</div></div>`;
 }
 $('#chrome').innerHTML=h;
 const cb=$('#cb');if(cb)cb.scrollTop=cb.scrollHeight;
 document.querySelectorAll('.nodechat').forEach(e=>e.scrollTop=e.scrollHeight);
 // sheet & switcher
 const sh=$('#sheet');
 if(S.sheet){sh.classList.add('on');sh.innerHTML=`<div class="hd"><b>${S.sheet==='bank'?'Банк вопросов · Go middle':'Inbox · Go middle'}</b><span class="sp"></span><button class="ghost" onclick="S.sheet=null;render()">✕</button></div><div class="bd">${S.sheet==='bank'?bankHTML(S.sheetArg):inboxHTML()}</div>`}else sh.classList.remove('on');
 const keys=Object.keys(VARIANTS);
 $('#switch').innerHTML=`<button onclick="cycle(-1)">←</button><span class="lbl">${S.variant} · ${VARIANTS[S.variant].name}</span><button onclick="cycle(1)">→</button><span style="opacity:.4">|</span><button class="${S.style==='hand'?'on':''}" onclick="setStyle('hand')">рукописный</button><button class="${S.style==='clean'?'on':''}" onclick="setStyle('clean')">чистый</button><button onclick="S=Object.assign(initState(),{variant:S.variant,style:S.style});render();fit()" title="сбросить">↺</button>`;
}
function setUrl(){const u=new URL(location);u.searchParams.set('variant',S.variant);u.searchParams.set('style',S.style);history.replaceState(null,'',u)}
function cycle(d){const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];S.sheet=null;setUrl();render();initialCam();}
function setStyle(s){S.style=s;setUrl();render()}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
function openSheet(k,a){S.sheet=k;S.sheetArg=a||null;if(S.variant==='C'&&k==='bank'){S.sheet=null;S.colTab='bank'}if(S.variant==='C'&&k==='inbox'){S.sheet=null;S.colTab='mat'}render()}
function openModal(k){const m=$('#modal');m.classList.add('on');m.innerHTML=`<div class="island"><div class="ttl" style="margin-bottom:10px">Новый мок · Go middle</div>
 <label class="row"><input type="radio" name="w" checked> Весь план</label><label class="row"><input type="radio" name="w"> Выбрать секции:</label>
 <div style="padding-left:22px">${SECTIONS.map(s=>`<label class="row small"><input type="checkbox" ${s.off?'':'checked'}> ${esc(s.title)} <span class="mute">${s.kind}</span></label>`).join('')}</div>
 <div class="small mute" style="margin-top:10px">Лимит времени</div><div class="row"><button class="sm pri">Без лимита</button><button class="sm">30 мин</button><button class="sm">60 мин</button></div>
 <div class="acts" style="margin-top:14px"><span class="sp"></span><button onclick="$('#modal').classList.remove('on')">Отмена</button><button class="pri" onclick="$('#modal').classList.remove('on');toast('В прототипе сессия «Мок 3» уже идёт')">Начать</button></div></div>`;}

// ---------- actions ----------
function agentLater(fn,ms=1500){S.working=true;render();setTimeout(()=>{S.working=false;fn();render()},ms)}
function act(a,arg){
 if(a==='exp'){S.exp[arg]=!S.exp[arg];if(arg.startsWith('t'))S.chatTab=arg;render();return}
 if(a==='reveal'){const x=q(arg);x.reveal=!x.reveal;render();return}
 if(a==='dispute'){q(arg).disputed=true;render();toast('Dispute отправлен агенту');return}
 if(a==='side'||a==='sideMsg'||a==='sideDebrief'){
  let from=arg,title,brief;
  if(a==='side'){const x=q(arg);title=x.topic.split(' ')[0]+': вопрос';brief=`Цель «Go middle». Вопрос: «${x.text}». ${x.answer?'Ответ кандидата приложен.':'Ответа ещё нет.'}`;if(x.status==='current'){x.hint=true;}}
  else if(a==='sideMsg'){from=curQ()?.id||'q3';title='Про сообщение';brief=`Фрагмент сообщения агента: «${S.chat[arg].t.slice(0,60)}…»`}
  else {from=S.qs[S.qs.length-1].id;title='Итог сессии';brief='Итог «Мок 3», изменения Topic status.'}
  const id='t'+(S.threads.length+1);
  S.threads.push({id,from,title,hint:a==='side'&&q(arg).hint,msgs:[{r:'a',brief,t:'Что разобрать?'}]});
  S.chatTab=id;S.chatOpen=true;S.colTab='chat';S.exp[id]=1;render();
  if(q(from)&&q(from).hint) toast('Ветка до ответа: попытка будет «с подсказкой»');
  return}
 if(a==='send'){const inp=$('#ci-'+arg);const t=inp.value.trim();if(!t)return;
  const list=arg==='main'?S.chat:arg==='setup'?S.setup:S.threads.find(x=>x.id===arg).msgs;list.push({r:'c',t});
  agentLater(()=>list.push({r:'a',t:arg==='main'?'Понял. Вернёмся к текущему вопросу на карточке.':arg==='setup'?'Принял. Набросаю план из трёх секций — он появится на холсте.':'Коротко: рантайм отцепляет P от M, ушедшего в syscall, и отдаёт его свободному M.'}));return}
 if(a==='submit'){const x=q(arg);const t=($('#ans-'+arg)?.value||'').trim()||'Рантайм отдаёт P другому потоку, чтобы горутины не стояли.';
  if(x.answer==null){x.answer=t;agentLater(()=>x.fu.push({a:'Уточните: какой поток подхватит этот P и откуда он возьмётся?'}));}
  else{x.fu[x.fu.length-1].c=t;x.status='done';x.grade=2;x.gaps=['Не сказано про sysmon и порог 20 мкс'];x.outline='Handoff P, sysmon, возврат M после syscall.';
   agentLater(()=>addQ(true))}
  return}
 if(a==='dunno'){const x=q(arg);x.answer='Не знаю';x.skipped=1;x.status='done';x.grade=0;x.gaps=['Тема не раскрыта'];x.outline='См. разбор в Side thread.';agentLater(()=>addQ(false));return}
 if(a==='finish'){const c=curQ();if(c){S.qs=S.qs.filter(x=>x!==c)}S.debrief=true;render();focusNode('deb');return}
}
function addQ(deeper){const p=S.qs[S.qs.length-1];const id='q'+(S.seq++);
 if(deeper&&DEEPER.length){S.qs.push({id,parent:p.id,deeper:1,sec:p.sec,topic:p.topic,text:DEEPER.shift(),fu:[],status:'current'})}
 else{const f=FRESH.shift()||['GC и память','Что такое escape analysis?'];S.qs.push({id,sec:'Go и конкурентность',topic:f[0],text:f[1],fu:[],status:'current'})}
 S.exp[id]=1;S.chat.push({r:'a',t:deeper?'Хороший ответ. Иду глубже.':'Ок, сменим тему.'});render();focusNode(id);}
function initialCam(){if(S.variant==='C'){focusNode('q3',.85);cam.y=40-S._spec.nodes.find(n=>n.id==='m3').y*cam.s;applyCam()}else fit();}
render();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{render();initialCam()});
</script>
</body></html>

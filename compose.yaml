services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: sensei-local
      POSTGRES_DB: sensei
    volumes:
      - guest-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensei"]
      interval: 1s
      timeout: 3s
      retries: 60
  api:
    image: ${COMPOSE_PROJECT_NAME}-app
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:sensei-local@postgres/sensei
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HTTP_PORT:-3000}:3000"
  worker:
    image: ${COMPOSE_PROJECT_NAME}-app
    depends_on:
      api:
        condition: service_started
    command: ["node", "apps/server/dist/worker.js"]
    environment:
      DATABASE_URL: postgres://postgres:sensei-local@postgres/sensei
volumes:
  guest-data:

# The tasks between "ticket ready" and "PR waits for the owner", led by /deliver.
# A task starts from the stage in `when`, gets one run with the instruction in `run`,
# and moves the ticket to `then` when `check` exits 0. Exit 3 from a check means a retry cannot help.
# Experimental: the deliver skill and its orchestrator come from the Agent Kit's factory experiment.
# Each task names the client, model and effort of its runs. /deliver may name others for one ticket:
# "deliver 19 with implement on <model>" becomes --model implement=<model>.
base = "main"               # a ticket started on this branch gets a worktree of its own
worktrees = "~/Worktrees/{project}"
branch = "issue-{name}"
setup = "pnpm install --frozen-lockfile"   # run once in a new worktree
# Run in the worktree by `finish`, after the merge: stop every Compose stand started from it.
cleanup = """docker compose ls -a --format json \\
  | jq -r --arg dir "$PWD/" '.[] | select(.ConfigFiles | startswith($dir)) | .Name' \\
  | while read -r stand; do docker compose -p "$stand" down -v; done"""
checks = "pnpm check"       # the project's one command for all its checks; a task's check names it as {checks}

[[task]]
name = "implement"
agent = "codex"
model = "gpt-6.2-sol"
effort = "high"
when = "ready"
run = "/implement {ticket}"
run_spec = "/implement-spec {ticket}"
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain)" \
  && git diff --check main...HEAD \
  && {checks}"""
attempts = 2
then = "verify"

# Behaviour is verified by a fresh run with the verify-interview-sensei skill; its report lands in .evidence/.
[[task]]
name = "verify"
agent = "codex"
model = "gpt-6.2-sol"
effort = "high"
when = "verify"
run = "Verify the behaviour of ticket {ticket} at the current commit with this project's verify skill. Check every acceptance criterion."
check = """v=$(sed -n 's/^Verdict: //p' .evidence/report.md 2>/dev/null | head -1)
c=$(sed -n 's/^Commit: //p' .evidence/report.md 2>/dev/null | head -1)
case "$(git rev-parse HEAD)" in "${c:-none}"*) ;; *) echo "no verification report for this commit"; exit 1 ;; esac
case "$v" in
  PASS|PASS+NOTES) exit 0 ;;
  FAIL|BLOCKED) echo "verification verdict: $v"; exit 3 ;;
  *) echo "no verification report"; exit 1 ;;
esac"""
attempts = 2
then = "delivery"

[[task]]
name = "ship"
agent = "codex"
model = "gpt-6.2-sol"
effort = "high"
when = "delivery"
run = "Ship the committed work on this branch for ticket {ticket}."
check = """gh pr view --json state -q .state | grep -q OPEN && gh pr checks >/dev/null"""
attempts = 2
then = "needs-owner"

# The owner asked for changes on the PR: `run <ticket> --stage rework`.
[[task]]
name = "rework"
agent = "codex"
model = "gpt-6.2-sol"
effort = "high"
when = "rework"
run = "Address the owner's unresolved feedback on this branch's pull request for ticket {ticket}: read its reviews and comments, change the code and commit. Then call the code-review skill on the changes since the commit you started from, and commit the fixes."
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain)" \
  && git diff --check main...HEAD \
  && {checks}"""
attempts = 2
then = "verify"

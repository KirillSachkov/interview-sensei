<!doctype html>
<!-- PROTOTYPE, throwaway. Ticket #3, iteration 2, round 3. Base: round-1 variant A (zones on canvas).
     Question: where does the main agent chat live on the canvas?
     ?variant=1 chat column inside the session area follows the current question
     ?variant=2 chat inside the session area, dragged by its header, stays where placed
     ?variant=3 agent avatar next to the current question, click expands the chat on canvas
     Common: larger UI, minimal Materials/Plan (pinnable), one collapsible area per session,
     Side thread chat on canvas, edge labels never cross arrows.
     Libraries: rough.js (MIT), font Caveat (OFL), both from CDN. In-memory state only. -->

<style>

.hint{font-size:13px;color:var(--mute)}

.sw.on{background:var(--acc)}.sw.on:after{left:14px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.15);display:none;align-items:center;justify-content:center;z-index:40}

#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#1e1e1e;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;display:none}

<script>

const SECTIONS=[

 {id:'s3',kind:'вопросы по темам',title:'PostgreSQL',topics:[['Индексы','shaky'],['Транзакции и изоляция','none']],q:23,nw:3},
 {id:'s4',kind:'проектирование',title:'System design',topics:[['Кеширование','none'],['Очереди','none']],q:8,nw:0,off:true},
];
const SRCICON={'вакансия':'💼','резюме':'👤','видео':'▶','ссылка':'🔗','файл':'📄'};
const BANK=[
 ['Чем горутина отличается от потока ОС?','Горутины и планировщик','видео «Мок собес Go #12»',{nw:1}],
 ['Как устроен буферизированный канал внутри?','Каналы и select','вакансия Авито',{nw:1}],
 ['Когда select выбирает ветку default?','Каналы и select','The Go Memory Model',{}],
 ['Как отменить группу горутин через context?','context','видео «Мок собес Go #12»',{warn:1}],
 ['Что такое write barrier в сборщике мусора?','GC и память','придумал агент',{nw:1,unc:1}],
 ['Что выведет код с замыканием в цикле? (квиз)','Горутины и планировщик','видео «Мок собес Go #12»',{nw:1}],
 ['Чем sync.Mutex отличается от sync.RWMutex?','Горутины и планировщик','вакансия Ozon',{}],
 ['Как работает escape analysis?','GC и память','The Go Memory Model',{nw:1}],
];
const PAST={
 m1:{t:'Мок 1',d:'2 нояб · 45 мин',qs:[['Самый сложный проект',2],['Mutex и RWMutex',1],['Как безопасно закрыть канал',1],['Индекс B-tree',2]],next:'Слабые места: каналы, мьютексы'},
 m2:{t:'Мок 2',d:'5 нояб · 30 мин',qs:[['Конфликт в команде',3],['Отмена через context',3],['Как работает GC',0],['Уровни изоляции',1]],next:'Слабые места: GC, изоляция'},
};
function initState(){return{
 sheet:null,sheetArg:null,working:false,sel:new Set(),onlyNew:false,debrief:false,seq:4,
 pin:{mat:false,plan:false,prog:false},draft:{},setupOpen:false,setup:[{r:'a',t:'Это настройка цели «Go middle»: материалы, план и правила отбора. Интервью здесь не идёт. Что поменяем?'}],open:{},sess:{m1:false,m2:false,m3:true},pos:{},chatOpen:false,plus:false,prefs:false,report:false,

 proc:[{name:'Собес в Яндекс: Go',p:45}],done:[{name:'Статья «Go Scheduler»',added:9,doubt:2}],
 prefsList:['Меньше определений, больше прикладных вопросов','Без вопросов про Go до 1.18'],
 chat:[{r:'a',t:'Мок 3: секция «Go и конкурентность», без лимита времени. Остановите, когда захотите.'},{r:'c',t:'Поехали. Без подсказок, пожалуйста.'},{r:'a',t:'Хорошо. Вопросы появляются карточками справа от меня.'}],
 qs:[
  {id:'q0',kind:'quiz',topic:'Горутины и планировщик',text:'Что выведет программа?',code:'for i := 0; i < 3; i++ {\n    go func() { fmt.Print(i) }()\n}\ntime.Sleep(time.Second)',opts:['0, 1 и 2 в любом порядке','333','Ничего'],pick:0,fu:[],status:'done',grade:3,gaps:[],outline:'С Go 1.22 у каждой итерации своя переменная i.'},
  {id:'q1',topic:'Горутины и планировщик',text:'Чем горутина отличается от потока ОС?',answer:'Горутина — лёгкий поток рантайма Go: стек от 2 КБ и растёт, переключение без ядра.',fu:[],status:'done',grade:3,gaps:[],outline:'Стек, стоимость переключения, планирование в user space.'},
  {id:'q2',deeper:1,topic:'Горутины и планировщик',text:'Как планировщик Go распределяет горутины по потокам ОС?',answer:'Модель GMP: G — горутина, M — поток, P — контекст с локальной очередью.',fu:[{a:'А если локальная очередь P пуста?',c:'Берёт из глобальной очереди или крадёт у другого P.'}],status:'done',grade:2,gaps:['Не назван netpoller','Нет handoff P при syscall'],outline:'GMP, work stealing, handoff, netpoller.'},
  {id:'q3',deeper:1,topic:'Горутины и планировщик',text:'Что делает рантайм, когда горутина уходит в блокирующий syscall?',fu:[],status:'current'},
 ],
 threads:[{id:'t1',from:'q2',title:'GMP на пальцах',open:false,msgs:[{r:'c',t:'Объясни GMP на пальцах, я путаю P и M.'},{r:'a',t:'M — поток ОС. P — «право» исполнять Go-код плюс очередь горутин. M работает, только держа P.'},{r:'c',t:'Зачем тогда P вообще?'},{r:'a',t:'Чтобы M, застрявший в syscall, отдал P с очередью другому M.'}]}],
};}
let S=initState();
const P=new URLSearchParams(location.search);
S.variant=P.get('variant')||'1';S.style=P.get('style')||'clean';
const DEEPER=['Что такое handoff P и когда рантайм его делает?','Как netpoller избавляет сетевой ввод-вывод от блокировки потока?'];
const FRESH=[['Каналы и select','Чем буферизированный канал отличается от небуферизированного?'],['GC и память','Когда сборщик мусора Go останавливает мир?']];
const VARIANTS={'1':'Чат в области сессии, едет за вопросом','2':'Чат в области сессии, двигается за ручку','3':'Аватар агента у вопроса, чат по клику'};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
const q=id=>S.qs.find(x=>x.id===id);
const curQ=()=>S.qs.find(x=>x.status==='current');
const working=()=>S.working?'<span class="working"><i></i>Агент работает…</span>':'';
const dots=ts=>ts.map(t=>`<span class="dot d-${t[1]}" title="${esc(t[0])}"></span>`).join('');

// ---------- fragments ----------
function qCard(x){
 let h=`<div class="qh"><span>${esc(x.topic)}</span>${x.kind==='quiz'?'<span class="tag">квиз</span>':''}${x.hint?'<span class="tag warn">с подсказкой</span>':''}${x.skipped?'<span class="tag">пропущено</span>':''}</div><div class="qt">${esc(x.text)}</div>`;
 if(x.kind==='quiz')h+=`<div class="code">${esc(x.code)}</div>`+x.opts.map((o,i)=>`<div class="opt ${i===x.pick?'on':''}">${esc(o)}</div>`).join('');
 if(x.answer!=null)h+=`<div class="ans">${esc(x.answer)}</div>`;
 x.fu.forEach(f=>{h+=`<div class="fu"><span class="mute">Уточнение:</span> ${esc(f.a)}${f.c?`<div class="ans">${esc(f.c)}</div>`:''}</div>`});
 if(x.status==='current'){
  h+=S.working?`<div style="margin-top:8px">${working()}</div>`:`${ta('ans-'+x.id,x.fu.length?'Уточните ответ…':'Ваш ответ…',null,'ansbox')}
  <div class="acts"><button class="pri" onclick="act('submit','${x.id}')">Ответить</button><button onclick="act('dunno','${x.id}')">Не знаю</button><span class="sp"></span><button class="ghost" title="Обсудить отдельно: откроется ветка, попытка будет с подсказкой" onclick="act('side','${x.id}')">↗ Обсудить</button></div>`;
 }else{
  h+=`<div class="acts"><button onclick="act('reveal','${x.id}')">${x.reveal?'Скрыть разбор':'Разбор'}</button><button class="ghost" title="Обсудить отдельно" onclick="act('side','${x.id}')">↗ Обсудить</button><span class="sp"></span><span class="hov"><button class="ghost ico" title="Полезный вопрос" onclick="toast('👍 сохранено')">👍</button><button class="ghost ico" title="В вопросе ошибка" onclick="toast('⚠ вопрос скрыт до исправления')">⚠</button><button class="ghost ico" title="Нерелевантный" onclick="toast('👎 исключён для этой цели')">👎</button></span></div>`;
  if(x.reveal)h+=`<div class="deb"><span class="grade g${x.grade}">${x.grade} из 3</span> ${x.disputed?'<span class="tag warn">оспорено</span>':''}
   ${x.gaps.length?'<ul>'+x.gaps.map(g=>`<li>${esc(g)}</li>`).join('')+'</ul>':'<div style="margin:4px 0">Пробелов нет.</div>'}
   <div class="mute small">Сильный ответ</div><div>${esc(x.outline||'')}</div>
   ${x.disputed?'':`<div class="acts"><button class="ghost" onclick="act('dispute','${x.id}')">Оспорить</button></div>`}</div>`;
 }

// ---------- build ----------
const CHAT_W=480,Q_W=480,SETUP_W=520;
function build(){
 const N=[],E=[],F=[];
 const left=[];
 if(!S.pin.prog)left.push({id:'prog',w:380,html:progress()});
 if(!S.pin.plan)left.push({id:'plan',w:380,html:plan()});
 if(!S.pin.mat)left.push({id:'mat',w:380,html:materials()});
 left.forEach((n,i)=>{if(i===0){n.x=0;n.y=0}else{n.below=left[i-1].id;n.gap=36}N.push(n)});
 let sx=left.length?480:0;
 if(S.setupOpen){N.push({id:'setup',x:sx+20,y:20,w:SETUP_W,cls:'cnode',stroke:'#1e1e1e',html:setupChat()});
  sx+=SETUP_W+140;}
 N.push({...pastCard('m1'),x:sx,y:0});
 N.push({...pastCard('m2'),rightOf:'m1',gap:40});
 if(!S.sess.m3){
  N.push({id:'m3c',rightOf:'m2',gap:40,w:280,stroke:'#6965db',html:`<div class="row" style="cursor:pointer" onclick="S.sess.m3=true;render()"><span class="ttl">Мок 3</span><span class="sp"></span><span class="mute">▾</span></div><div class="mute small">${S.debrief?'завершён':'идёт'} · ${S.qs.length} вопроса</div><div style="margin-top:8px">${S.qs.map(x=>`<span class="dot ${x.status==='current'?'d-none':'d-shaky'}"></span>`).join(' ')}</div>`});
  return{nodes:N,edges:E,frames:F};
 }
 const reserve=S.variant==='3'?(S.chatOpen?CHAT_W+60:200):CHAT_W+60;
 N.push({id:'m3a',rightOf:'m2',gap:80+reserve,w:Q_W,h:1,bare:1,html:'',shape:'none'});
 let prev='m3a';
 S.qs.forEach((x,i)=>{N.push({id:x.id,below:prev,gap:i?70:30,w:Q_W,html:qCard(x),stroke:x.status==='current'?'#6965db':null,sw:x.status==='current'?2.4:null});if(i)E.push({from:prev,to:x.id,label:x.deeper?'глубже':'',cur:x.status==='current'});prev=x.id;});
 if(S.debrief){N.push({id:'deb',below:prev,gap:70,w:Q_W,html:debriefCard(),stroke:'#2f9e44'});E.push({from:prev,to:'deb'});prev='deb';}
 const anchor=curQ()?.id||prev;
 if(S.variant==='1')N.push({id:'chat',leftOf:anchor,gap:60,w:CHAT_W,cls:'cnode',html:agentChat(),alignBottom:1});
 if(S.variant==='2'){const p=S.pos.chat||{dx:0,dy:0};N.push({id:'chat',leftOf:'m3a',gap:60,w:CHAT_W,cls:'cnode',html:agentChat(),dx:p.dx,dy:p.dy+30});}
 if(S.variant==='3'){
  if(S.chatOpen)N.push({id:'chat',leftOf:anchor,gap:60,w:CHAT_W,cls:'cnode',html:agentChat(),stroke:'#6965db'});
  else N.push({id:'chat',leftOf:anchor,gap:40,w:150,stroke:S.working?'#6965db':null,html:`<div class="row" style="cursor:pointer;font-weight:600" title="Открыть разговор с интервьюером" onclick="S.chatOpen=true;S.unread=0;render()">Чат ${S.unread?`<span class="tag acc">${S.unread}</span>`:`<span class="tag">${S.chat.length}</span>`}<span class="sp"></span>${S.working===true?'<span class="working"><i></i></span>':'▸'}</div>`});
 }
 const used={};
 S.threads.forEach(t=>{const from=t.from;const prevT=used[from];
  N.push({...threadNode(t),rightOf:prevT||from,gap:prevT?40:120});
  E.push({from:prevT||from,to:t.id,dash:1,side:1,color:'#e8590c'});used[from]=t.id;});
 const ids=N.filter(n=>['m3a','chat','deb'].includes(n.id)||S.qs.some(x=>x.id===n.id)||S.threads.some(t=>t.id===n.id)).map(n=>n.id);
 F.push({ids,header:`<b>Мок 3</b><span class="mute small">${S.debrief?'завершён':'идёт'} · без лимита · Go и конкурентность</span>${S.debrief?'':`<button onclick="act('finish')">Завершить</button>`}<button class="ghost" onclick="S.sess.m3=false;render()" title="Свернуть область">▴ свернуть</button>`});
 return{nodes:N,edges:E,frames:F};
}

let cam={x:60,y:110,s:1};
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%2147483647;return h}
function render(){
 document.body.className='st-'+S.style;
 const spec=build(),world=$('#world');
 world.innerHTML='<svg id="sv" xmlns="http://www.w3.org/2000/svg"></svg>';
 const by={};
 spec.nodes.forEach(n=>{const el=document.createElement('div');el.className='node'+(n.bare?' bare':'')+(n.cls?' '+n.cls:'');el.dataset.id=n.id;el.style.width=n.w+'px';if(n.h)el.style.height=n.h+'px';el.innerHTML=n.html;world.appendChild(el);n.el=el;by[n.id]=n;});
 spec.nodes.forEach(n=>{n.hh=n.h||n.el.offsetHeight;
  if(n.below){const p=by[n.below];n.x=p.x+p.w/2-n.w/2;n.y=p.y+p.hh+(n.gap??60);}
  else if(n.rightOf){const p=by[n.rightOf];n.x=p.x+p.w+(n.gap??100);n.y=p.y;}
  else if(n.leftOf){const p=by[n.leftOf];n.x=p.x-n.w-(n.gap??60);n.y=n.alignBottom?Math.max(by.m3a?by.m3a.y+30:0,p.y+p.hh-n.hh):p.y;}
  n.x+=n.dx||0;n.y+=n.dy||0;
  if(n.noOverlap){let moved=true;while(moved){moved=false;for(const o of spec.nodes){if(o===n)break;if(!o.noOverlap)continue;if(o.x<n.x+n.w&&n.x<o.x+o.w&&o.y<n.y+n.hh+40&&n.y<o.y+o.hh+40){n.y=o.y+o.hh+48;moved=true}}}}
  n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';});
 const sv=$('#sv'),hand=S.style==='hand'&&window.rough,rc=hand?rough.svg(sv):null,add=e=>sv.appendChild(e);
 const mk=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e};
 spec.frames.forEach(f=>{const ns=f.ids.map(i=>by[i]).filter(Boolean);const x0=Math.min(...ns.map(n=>n.x))-30,y0=Math.min(...ns.map(n=>n.y))-30,x1=Math.max(...ns.map(n=>n.x+n.w))+30,y1=Math.max(...ns.map(n=>n.y+n.hh))+30;
  add(hand?rc.rectangle(x0,y0,x1-x0,y1-y0,{stroke:'#b8b5ad',strokeLineDash:[9,9],roughness:.7,seed:3,fill:'rgba(105,101,219,.03)',fillStyle:'solid'}):mk('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:18,fill:'rgba(105,101,219,.03)',stroke:'#cfccc4','stroke-dasharray':'7 6'}));
  const l=document.createElement('div');l.className='fh';l.style.left=x0+'px';l.style.top=y0+'px';l.innerHTML=f.header;world.appendChild(l);});
 const mid=n=>n.h?n.hh/2:Math.min(n.hh/2,40);
 spec.edges.forEach(e=>{const a=by[e.from],b=by[e.to];if(!a||!b)return;let p1,p2,horiz=false;
  if(!e.side&&b.y>=a.y+a.hh-2){p1=[a.x+a.w/2,a.y+a.hh+5];p2=[b.x+b.w/2,b.y-5]}
  else{horiz=true;p1=[a.x+a.w+5,a.y+mid(a)];p2=[b.x-5,b.y+mid(b)]}
  const col=e.color||(e.cur?'#6965db':'#1e1e1e'),ang=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]),L=13;
  const h1=[p2[0]-L*Math.cos(ang-.45),p2[1]-L*Math.sin(ang-.45)],h2=[p2[0]-L*Math.cos(ang+.45),p2[1]-L*Math.sin(ang+.45)];
  let pts=[p1,p2];if(e.side&&Math.abs(p2[1]-p1[1])>8){const xm=p1[0]+36;pts=[p1,[xm,p1[1]],[xm,p2[1]],p2]}
  if(e.side&&pts.length>2){const ang2=0;const g1=[p2[0]-L,p2[1]-L*.45],g2=[p2[0]-L,p2[1]+L*.45];
   if(hand){const o={stroke:col,strokeWidth:1.5,roughness:.8,seed:hash(e.from+e.to)};add(rc.linearPath(pts,{...o,strokeLineDash:[8,7]}));add(rc.linearPath([g1,p2,g2],o));}
   else{add(mk('path',{d:'M'+pts.join('L'),stroke:col,'stroke-width':1.5,fill:'none','stroke-dasharray':'7 6'}));add(mk('path',{d:`M${g1}L${p2}L${g2}`,stroke:col,'stroke-width':1.5,fill:'none'}));}
   if(e.label){const t=mk('text',{x:pts[2][0]+12,y:p2[1]-10,class:'edge-label'});t.textContent=e.label;add(t);}return;}
  if(hand){const o={stroke:col,strokeWidth:1.5,roughness:1,seed:hash(e.from+e.to)};add(rc.line(...p1,...p2,{...o,strokeLineDash:e.dash?[8,7]:undefined}));add(rc.linearPath([h1,p2,h2],o));}
  else{add(mk('path',{d:`M${p1}L${p2}`,stroke:col,'stroke-width':1.5,fill:'none','stroke-dasharray':e.dash?'7 6':''}));add(mk('path',{d:`M${h1}L${p2}L${h2}`,stroke:col,'stroke-width':1.5,fill:'none'}));}
  // label never on the line: beside a vertical edge, above a horizontal one, away from the arrowhead
  if(e.label){const t=horiz?mk('text',{x:p1[0]+(p2[0]-p1[0])*.4,y:Math.min(p1[1],p2[1])-10,'text-anchor':'middle',class:'edge-label'}):mk('text',{x:p1[0]+12,y:(p1[1]+p2[1])/2-2,class:'edge-label'});t.textContent=e.label;add(t);}
 });
 spec.nodes.forEach(n=>{if(n.shape==='none')return;const{x,y,w}=n,h=n.hh;const stroke=n.stroke||(hand?'#1e1e1e':'#d6d3cc'),sw=n.sw||(hand?1.5:1.2);

  if(hand)add(rc.path(rr(x,y,w,h,16),{stroke,strokeWidth:sw,fill:'#fff',fillStyle:'solid',roughness:1,seed:hash(n.id)}));
  else add(mk('rect',{x,y,width:w,height:h,rx:14,fill:'#fff',stroke,'stroke-width':sw}));});
 world.insertBefore(sv,world.firstChild);
 S._spec=spec;S._by=by;applyCam();chrome();
 document.querySelectorAll('.nodechat').forEach(e=>e.scrollTop=e.scrollHeight);
}
function rr(x,y,w,h,r){return `M${x+r},${y}L${x+w-r},${y}Q${x+w},${y} ${x+w},${y+r}L${x+w},${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}L${x+r},${y+h}Q${x},${y+h} ${x},${y+h-r}L${x},${y+r}Q${x},${y} ${x+r},${y}Z`}
function applyCam(){$('#world').style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;const z=$('#zv');if(z)z.textContent=Math.round(cam.s*100)+'%'}
function fit(){const ns=S._spec.nodes.filter(n=>n.shape!=='none');const x0=Math.min(...ns.map(n=>n.x)),y0=Math.min(...ns.map(n=>n.y)),x1=Math.max(...ns.map(n=>n.x+n.w)),y1=Math.max(...ns.map(n=>n.y+n.hh));
 cam.s=Math.max(.4,Math.min(1,(innerWidth-80)/(x1-x0),(innerHeight-230)/(y1-y0)));cam.x=(innerWidth-(x1-x0)*cam.s)/2-x0*cam.s;cam.y=160-y0*cam.s;applyCam();}
function focusNode(id,s){const n=S._by[id];if(!n)return;cam.s=s||cam.s;cam.x=innerWidth/2-(n.x+n.w/2)*cam.s+(S.variant!=='3'||S.chatOpen?CHAT_W/2*cam.s:0);cam.y=innerHeight*.55-(n.y+Math.min(n.hh,500)/2)*cam.s;applyCam();}
function zoom(f,cx=innerWidth/2,cy=innerHeight/2){const ns=Math.max(.25,Math.min(2,cam.s*f));cam.x=cx-(cx-cam.x)*ns/cam.s;cam.y=cy-(cy-cam.y)*ns/cam.s;cam.s=ns;applyCam();}
let spaceDown=false;
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('input,textarea')){spaceDown=true;$('#vp').classList.add('drag');e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;$('#vp').classList.remove('drag')}});
(function(){const vp=$('#vp');let d=null,nd=null;
 vp.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
 vp.addEventListener('wheel',e=>{const sc=e.target.closest('.scroll');if(sc&&sc.scrollHeight>sc.clientHeight&&!e.ctrlKey)return;e.preventDefault();
  if(e.ctrlKey||e.metaKey)zoom(Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{cam.x-=e.deltaX;cam.y-=e.deltaY;applyCam()}},{passive:false});
 vp.addEventListener('mousedown',e=>{const h=e.target.closest('[data-drag]');
  if(e.button===1||(spaceDown&&e.button===0)){e.preventDefault();d={x:e.clientX-cam.x,y:e.clientY-cam.y};vp.classList.add('drag');return}
  if(h&&!e.target.closest('button,input')){const el=h.closest('.node');const p=S.pos.chat||{dx:0,dy:0};nd={el,sx:e.clientX,sy:e.clientY,p,l:parseFloat(el.style.left),t:parseFloat(el.style.top)};e.preventDefault();return}
  if(e.target.closest('button,input,textarea,.chip,.pr,.opt,.prop,.fh'))return;if(e.target.closest('.node'))return;
  d={x:e.clientX-cam.x,y:e.clientY-cam.y};vp.classList.add('drag')});
 addEventListener('mousemove',e=>{if(nd){const dx=(e.clientX-nd.sx)/cam.s,dy=(e.clientY-nd.sy)/cam.s;nd.el.style.left=nd.l+dx+'px';nd.el.style.top=nd.t+dy+'px';nd.d=[dx,dy];return}if(!d)return;cam.x=e.clientX-d.x;cam.y=e.clientY-d.y;applyCam()});
 addEventListener('mouseup',()=>{if(nd){if(nd.d)S.pos.chat={dx:nd.p.dx+nd.d[0],dy:nd.p.dy+nd.d[1]};nd=null;render();return}d=null;vp.classList.remove('drag')});
})();

// ---------- chrome ----------
function chrome(){
 let h=`<div id="tl" class="island"><button class="ghost" style="color:var(--ink)" onclick="$('#menuT').classList.toggle('on')"><b>Go middle</b> ▾</button></div>
 <div id="menuT" class="island"><div><b>Go middle</b> <span class="mute small">Авито · Ozon</span></div><div onclick="openSetup();$('#menuT').classList.remove('on')">⚙︎ Настроить цель</div><div onclick="toast('В прототипе одна цель')"><b>Tech Lead</b> <span class="mute small">Яндекс</span></div><div style="color:var(--acc)" onclick="toast('Новая цель: пустой холст и разговор с агентом')">＋ Новая цель</div></div>
 <div id="tc" class="island"><button class="pri big" onclick="openModal()">▶ Начать мок</button><button class="ghost big" style="font-weight:500" onclick="openSheet('bank')">Банк вопросов</button><button class="ghost big" style="font-weight:500" onclick="openSetup()">Настроить цель</button></div>
 <div id="zoom" class="island"><button onclick="zoom(1/1.2)">−</button><span id="zv" class="small" style="width:52px;text-align:center">${Math.round(cam.s*100)}%</span><button onclick="zoom(1.2)">+</button><button onclick="fit()" title="Показать всё">⤢</button>${curQ()&&S.sess.m3?`<button onclick="focusNode('${curQ().id}',1)">К вопросу</button>`:''}</div>`;
 if(S.pin.mat||S.pin.plan||S.pin.prog)h+=`<div id="pinCol">${S.pin.prog?`<div class="island">${progress()}</div>`:''}${S.pin.mat?`<div class="island">${materials()}</div>`:''}${S.pin.plan?`<div class="island">${plan()}</div>`:''}</div>`;
 $('#chrome').innerHTML=h;
 const sh=$('#sheet');
 if(S.sheet){sh.classList.add('on');sh.innerHTML=`<div class="hd"><b>Банк вопросов</b><span class="sp"></span><button class="ghost" onclick="S.sheet=null;render()">✕</button></div><div class="bd">${bankHTML(S.sheetArg)}</div>`}else sh.classList.remove('on');
 $('#switch').innerHTML=`<button onclick="cycle(-1)">←</button><span class="lbl">${S.variant} · ${VARIANTS[S.variant]}</span><button onclick="cycle(1)">→</button><span style="opacity:.4">|</span><button class="${S.style==='hand'?'on':''}" onclick="setStyle('hand')">рукописный</button><button class="${S.style==='clean'?'on':''}" onclick="setStyle('clean')">чистый</button><button onclick="reset()" title="Сбросить">↺</button>`;
}
function bankHTML(sec){
 sec=sec||'Все';const rows=BANK.filter(b=>!S.onlyNew||b[3].nw);
 return `<div class="row wrap" style="margin-bottom:12px">${['Все',...SECTIONS.map(s=>s.title)].map(s=>`<button class="${s===sec?'pri':''}" onclick="S.sheetArg='${s}';render()">${esc(s)}</button>`).join('')}</div>
 <label class="row" style="margin-bottom:6px"><input type="checkbox" ${S.onlyNew?'checked':''} onchange="S.onlyNew=this.checked;render()" style="width:18px;height:18px"> Только новые с последнего просмотра <span class="tag acc">10</span></label>
 ${rows.map(b=>`<div class="bq"><input type="checkbox" ${S.sel.has(b[0])?'checked':''} onchange="this.checked?S.sel.add(this.dataset.k):S.sel.delete(this.dataset.k);render()" data-k="${esc(b[0])}"><div><div>${esc(b[0])}</div><div class="mute">${esc(b[1])} · ${esc(b[2])} ${b[3].nw?'<span class="tag acc">новый</span>':''} ${b[3].unc?'<span class="tag">не подтверждён</span>':''} ${b[3].warn?'<span class="tag warn">⚠ ошибка</span>':''}</div></div></div>`).join('')}
 ${S.sel.size?`<div class="bulk"><span>Выбрано ${S.sel.size}</span><span class="sp"></span><button onclick="bulk('Скрыто')">Скрыть</button><button onclick="bulk('Удалено (с попытками — скрыто)')">Удалить</button><button onclick="bulk('Помечено ⚠')">⚠</button><button onclick="bulk('Помечено 👍')">👍</button></div>`:''}`;
}
function bulk(t){toast(t+': '+S.sel.size);S.sel.clear();render()}
function openSheet(k,a){S.sheet=k;S.sheetArg=a||null;render()}
function openModal(){const m=$('#modal');m.classList.add('on');m.innerHTML=`<div class="island"><div class="ttl" style="margin-bottom:14px">Новый мок</div>
 <label class="row" style="margin:6px 0"><input type="radio" name="w" checked> Весь план</label><label class="row" style="margin:6px 0"><input type="radio" name="w"> Выбрать секции</label>
 <div style="padding-left:26px">${SECTIONS.map(s=>`<label class="row small" style="margin:4px 0"><input type="checkbox" ${s.off?'':'checked'}> ${KIND[s.kind]} ${esc(s.title)}</label>`).join('')}</div>
 <div class="mute small" style="margin-top:14px">Время</div><div class="row" style="margin-top:6px"><button class="pri">Без лимита</button><button>30 мин</button><button>60 мин</button></div>
 <div class="acts" style="margin-top:18px"><span class="sp"></span><button onclick="$('#modal').classList.remove('on')">Отмена</button><button class="pri" onclick="$('#modal').classList.remove('on');toast('В прототипе «Мок 3» уже идёт')">Начать</button></div></div>`;}
function setUrl(){const u=new URL(location);u.searchParams.set('variant',S.variant);u.searchParams.set('style',S.style);history.replaceState(null,'',u)}
function cycle(d){const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];setUrl();render();focusNode(curQ()?.id||'q3',1)}
function setStyle(s){S.style=s;setUrl();render()}
function reset(){S=Object.assign(initState(),{variant:S.variant,style:S.style});DEEPER.splice(0,9,'Что такое handoff P и когда рантайм его делает?','Как netpoller избавляет сетевой ввод-вывод от блокировки потока?');render();focusNode('q3',1)}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});

// ---------- actions ----------
function openSetup(intent){S.setupOpen=true;if(intent)setupQuick(intent,true);else render();focusNode('setup');const i=$('#ci-setup');if(i)i.focus()}
function setupQuick(x,silent){
 if(x==='Добавить материалы'){S.setup.push({r:'c',t:'Хочу добавить материалы.'});agentLater(()=>S.setup.push({r:'a',t:'Пришлите файл, ссылку или текст вакансии: 📎 или перетащите сюда. Разбирать буду в фоне, вопросы появятся в банке.'}),'setup');return}
 if(x==='Изменить план'){S.setup.push({r:'c',t:'Хочу поменять план.'});agentLater(()=>S.setup.push({r:'a',t:'В вакансии Авито есть Kafka, а в плане её нет. Предлагаю:',prop:{kind:'plan',text:'＋ Секция «Очереди и Kafka» · 🧩 проектирование · после System design'}}),'setup');return}
 if(x==='Новое правило отбора'){S.setup.push({r:'c',t:'Хочу поменять, какие вопросы мне попадаются.'});agentLater(()=>S.setup.push({r:'a',t:'Опишите своими словами, что не так. Например: «слишком много вопросов на определения».'}),'setup');return}
}
function setupReply(t){
 if(/план|секци/i.test(t))return{r:'a',t:'Понял. Предлагаю такое изменение:',prop:{kind:'plan',text:'＋ Секция «Очереди и Kafka» · 🧩 проектирование · после System design'}};
 if(/http|www\.|\.com|\.ru/i.test(t)){S.proc.push({name:t.slice(0,28),p:5});return{r:'a',t:'Принял ссылку. Разбираю в фоне, прогресс виден в «Материалах».'}}
 if(/правил|меньше|больше|без |слишком/i.test(t))return{r:'a',t:'Сформулирую правило так:',prop:{kind:'rule',text:'Правило отбора: «'+t+'»'}};
 return{r:'a',t:'Понял. Здесь я меняю материалы, план и правила отбора. Что из этого поправить?'};
}
function applyProp(i,ok){const m=S.setup[i];m.prop.state=ok?'ok':'no';render();if(!ok)return;
 if(m.prop.kind==='plan'){SECTIONS.push({id:'s5',kind:'проектирование',title:'Очереди и Kafka',topics:[['Kafka','none'],['Гарантии доставки','none']],q:0,nw:0});agentLater(()=>S.setup.push({r:'a',t:'Секция добавлена в план. Наполнить её вопросами из материалов?',prop:{kind:'fill',text:'Найти вопросы про Kafka в материалах и добавить в секцию'}}),'setup')}
 if(m.prop.kind==='rule'){S.prefsList.push(m.prop.text.replace(/^Правило отбора: /,''));agentLater(()=>S.setup.push({r:'a',t:'Правило добавлено. Перепроверить базу под него?',prop:{kind:'fill',text:'Перепроверить 92 вопроса в фоне и показать, что скрою'}}),'setup')}
 if(m.prop.kind==='fill'){S.proc.push({name:'Перепроверка базы',p:5});render();toast('Агент работает в фоне: смотрите «Материалы»')}
}
function attach(files){const f=[...files].map(f=>f.name);if(!f.length)return;f.forEach(n=>{S.setup.push({r:'c',t:'📎 '+n});S.proc.push({name:n,p:5})});agentLater(()=>S.setup.push({r:'a',t:`Принял ${f.length===1?'«'+f[0]+'»':f.length+' файла'}. Разбираю в фоне, прогресс виден в «Материалах». Отчёт пришлю сюда.`}),'setup')}
function dropSetup(e,el){e.preventDefault();el.classList.remove('over');attach(e.dataTransfer.files||[])}
function agentLater(fn,who=true,ms=1400){S.working=who;render();setTimeout(()=>{S.working=false;fn();if(who===true&&S.variant==='3'&&!S.chatOpen)S.unread=(S.unread||0)+1;render()},ms)}
function takeDraft(id){const el=$('#'+id);const v=(el?.value||S.draft[id]?.v||'').trim();delete S.draft[id];return v}
function act(a,arg){
 if(a==='reveal'){const x=q(arg);x.reveal=!x.reveal;render();return}
 if(a==='dispute'){q(arg).disputed=true;render();toast('Агент пересмотрит оценку');return}
 if(a==='topen'){const t=S.threads.find(t=>t.id===arg);t.open=!t.open;render();return}
 if(a==='side'||a==='sideMsg'||a==='sideDebrief'){
  let from=arg,title,brief;
  if(a==='side'){const x=q(arg);title=x.topic.split(' ')[0]+': разобраться';brief=`Вопрос: «${x.text}». ${x.answer?'Ответ приложен.':'Ответа ещё нет.'}`;if(x.status==='current')x.hint=true;}
  else if(a==='sideMsg'){from=curQ()?.id||'q3';title='Про реплику интервьюера';brief=`Реплика: «${S.chat[arg].t.slice(0,60)}…»`}
  else{from='deb';title='Итог сессии';brief='Итог «Мок 3» и изменения тем.'}
  const id='t'+(S.threads.length+1);
  S.threads.push({id,from,title,open:true,hint:a==='side'&&q(arg).hint,msgs:[{r:'a',brief,t:'Что разобрать?'}]});
  render();focusNode(id);if(a==='side'&&q(arg).hint)toast('Ветка до ответа: попытка будет с подсказкой');return}
 if(a==='send'){const t=takeDraft('ci-'+arg);if(!t)return;
  if(arg==='setup'){S.setup.push({r:'c',t});agentLater(()=>S.setup.push(setupReply(t)),'setup');return}
  const list=arg==='main'?S.chat:S.threads.find(x=>x.id===arg).msgs;list.push({r:'c',t});
  agentLater(()=>list.push({r:'a',t:arg==='main'?'Понял. Вернёмся к вопросу на карточке. Материалы и план меняются в «Настроить цель».':'Коротко: рантайм отцепляет P от M в syscall и отдаёт его свободному M.'}),arg==='main'?true:arg);return}
 if(a==='submit'){const x=q(arg);const t=takeDraft('ans-'+arg)||'Рантайм отдаёт P другому потоку, чтобы горутины не стояли.';
  if(x.answer==null){x.answer=t;agentLater(()=>x.fu.push({a:'Какой поток подхватит этот P и откуда он возьмётся?'}));}
  else{x.fu[x.fu.length-1].c=t;x.status='done';x.grade=2;x.gaps=['Не сказано про sysmon'];x.outline='Handoff P, sysmon, возврат M после syscall.';agentLater(()=>addQ(true))}
  return}
 if(a==='dunno'){const x=q(arg);delete S.draft['ans-'+arg];x.answer='Не знаю';x.skipped=1;x.status='done';x.grade=0;x.gaps=['Тема не раскрыта'];x.outline='Разберите в ветке.';agentLater(()=>addQ(false));return}
 if(a==='finish'){S.qs=S.qs.filter(x=>x.status!=='current');S.debrief=true;S.chat.push({r:'a',t:'Сессия завершена. Итог — внизу области.'});render();focusNode('deb');return}
}
function addQ(deeper){const p=S.qs[S.qs.length-1];const id='q'+(S.seq++);
 if(deeper&&DEEPER.length)S.qs.push({id,deeper:1,topic:p.topic,text:DEEPER.shift(),fu:[],status:'current'});
 else{const f=FRESH.shift()||['GC и память','Что такое escape analysis?'];S.qs.push({id,topic:f[0],text:f[1],fu:[],status:'current'})}
 S.chat.push({r:'a',t:deeper?'Иду глубже.':'Сменим тему.'});render();focusNode(id);}
render();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{render();focusNode('q3',1)});
</script>

# The tasks between "ticket ready" and "PR waits for the owner", led by /deliver.
# A task starts from the stage in `when`, gets one run with the instruction in `run`,
# and moves the ticket to `then` when `check` exits 0. Exit 3 from a check means a retry cannot help.
# Experimental: the deliver skill and its orchestrator come from the Agent Kit's factory experiment.
agent = "claude"            # the client and model of every run; a task may name its own
model = "sonnet"
base = "main"               # a ticket started on this branch gets a worktree of its own
worktrees = "~/Worktrees/{project}"
branch = "issue-{name}"
# setup = "pnpm install"    # run once in a new worktree, when the application has dependencies

[[task]]
name = "implement"
when = "ready"
run = "/implement {ticket}"
run_spec = "/implement-spec {ticket}"
# Add the project's test command here once the application has one.
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain)" \
  && git diff --check main...HEAD"""
attempts = 2
then = "delivery"


[[task]]
name = "ship"
when = "delivery"
run = "Ship the committed work on this branch for ticket {ticket}."
check = """gh pr view --json state -q .state | grep -q OPEN && gh pr checks >/dev/null"""
attempts = 2
then = "needs-owner"

# The owner asked for changes on the PR: `run <ticket> --stage rework`.
[[task]]
name = "rework"
when = "rework"
run = "Address the owner's unresolved feedback on this branch's pull request for ticket {ticket}: read its reviews and comments, change the code and commit."
check = """test -n "$(git log main..HEAD --oneline)" \
  && test -z "$(git status --porcelain)" \
  && git diff --check main...HEAD"""
attempts = 2
then = "delivery"
